<style>
:root{--ink:#4f3545;--muted:#8f6b7e;--pink:#eaa3b8;--rose:#c76d91;--deep:#8d3f66;--glass:#fffafaa8;--mx:50%;--my:30%}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);min-height:100svh;display:grid;place-items:center;padding:40px 18px 130px;position:relative;
background:radial-gradient(ellipse at 15% 15%,#fffaf9 0%,transparent 45%),radial-gradient(ellipse at 90% 80%,#f9cfde 0%,transparent 52%),linear-gradient(145deg,#fff7f8,#f8e1e9 70%,#f4d3e2)}
body.locked{overflow:hidden;height:100svh}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(420px circle at var(--mx) var(--my),#ffffffa6,transparent 70%)}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.16;z-index:1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}
.orb{position:fixed;border-radius:50%;filter:blur(30px);pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.orb.one{width:380px;height:380px;left:-150px;top:-140px;background:#f5c3d5aa}
.orb.two{width:480px;height:480px;right:-210px;bottom:-200px;background:#ee9fc19a;animation-delay:-7s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.petal{position:absolute;top:-28px;left:var(--left);width:var(--width);aspect-ratio:3/4;border-radius:78% 22% 68% 32%/65% 29% 71% 35%;background:linear-gradient(138deg,#fff4f8 10%,#eda5bc 71%,#d97b9f);opacity:var(--opacity);animation:fall var(--duration) var(--delay) linear infinite}
@keyframes fall{from{transform:translate3d(0,0,0) rotate(0) rotateY(0)}25%{transform:translate3d(calc(var(--drift)*.45),30vh,0) rotate(88deg) rotateY(30deg)}50%{transform:translate3d(calc(var(--drift)*.12),56vh,0) rotate(182deg) rotateY(72deg)}75%{transform:translate3d(calc(var(--drift)*.85),83vh,0) rotate(258deg) rotateY(148deg)}to{transform:translate3d(var(--drift),calc(100vh + 56px),0) rotate(360deg) rotateY(190deg)}}
.branch{position:fixed;z-index:1;width:min(34vw,340px);opacity:.34;pointer-events:none;transform:rotate(var(--a));animation:sway 9s ease-in-out infinite}
.branch.left{--a:-15deg;left:-70px;top:-30px;transform-origin:top left}
.branch.right{--a:160deg;right:-90px;bottom:-30px;animation-delay:-4s}
@keyframes sway{50%{transform:rotate(calc(var(--a) + 4deg))}}

/* card */
.card{position:relative;z-index:3;width:min(100%,920px);padding:clamp(34px,7vw,80px) clamp(18px,6vw,72px);border-radius:34px;text-align:center;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
border:1px solid #ffffffc4;box-shadow:0 40px 100px #9f5e8030,0 1px 0 #fff inset,0 0 0 8px #ffffff40}
.card::before{content:"";position:absolute;inset:14px;border:1px solid #e7b8cb;border-radius:24px;pointer-events:none;opacity:.7}
.corner{position:absolute;width:26px;height:26px;border:1px solid var(--rose);opacity:.6}
.corner.tl{top:24px;left:24px;border-right:0;border-bottom:0;border-top-left-radius:10px}
.corner.tr{top:24px;right:24px;border-left:0;border-bottom:0;border-top-right-radius:10px}
.corner.bl{bottom:24px;left:24px;border-right:0;border-top:0;border-bottom-left-radius:10px}
.corner.br{bottom:24px;right:24px;border-left:0;border-top:0;border-bottom-right-radius:10px}
.orn{width:54px;height:54px;margin:0 auto 18px;display:block;animation:spin 40s linear infinite;filter:drop-shadow(0 4px 8px #cf8ba85c)}
@keyframes spin{to{transform:rotate(360deg)}}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.heading{font-family:'Playfair Display',Georgia,serif;font-size:clamp(28px,5.8vw,62px);font-weight:500;line-height:1.1;letter-spacing:-.035em;margin:16px 0 0}
.heading em{display:block;font-style:italic;background:linear-gradient(100deg,#8d3f66,#d1688f 50%,#8d3f66);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.divider{display:flex;align-items:center;gap:14px;max-width:240px;margin:28px auto 36px}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#dca1b8)}
.divider i:last-child{transform:scaleX(-1)}
.divider b{width:7px;height:7px;transform:rotate(45deg);background:var(--rose);border-radius:1px}
.countdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(7px,1.7vw,16px)}
.unit{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(160deg,#fff,#ffeef4);border:1px solid #f3dce4;box-shadow:0 10px 26px #bc82961c;padding:clamp(18px,3vw,30px) 4px 18px;transition:transform .35s}
.unit:hover{transform:translateY(-4px)}
.unit::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#f0d3de;opacity:.8}
.num{position:relative;z-index:1;font-family:'Playfair Display',Georgia,serif;font-variant-numeric:tabular-nums;font-size:clamp(30px,6vw,62px);line-height:1.1;color:#7d3d5c;letter-spacing:-.05em}
.label{margin-top:12px;font-size:clamp(9px,1.4vw,11px);letter-spacing:.16em;color:#825a6d;font-weight:700;text-transform:uppercase}
.progress{margin:34px auto 0;max-width:520px}
.bar{height:6px;border-radius:99px;background:#f1d4df;overflow:hidden}
.bar span{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#eaa3b8,#c76d91);transition:width 1.4s cubic-bezier(.22,.61,.36,1)}
.pmeta{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.date{display:inline-flex;align-items:center;gap:10px;border:1px solid #eac4d3;background:#fff8fb;border-radius:99px;padding:10px 18px;margin-top:26px;font-size:12px;letter-spacing:.06em;color:#854662}
.date svg{width:14px;height:14px}
.reveal{opacity:0;transform:translateY(16px);animation:rise .9s cubic-bezier(.22,.61,.36,1) forwards;animation-delay:calc(var(--i)*110ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;text-align:center;background:linear-gradient(145deg,#fff5f7e6,#f6d3e2f0);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);transition:opacity .9s,visibility .9s}
#gate.out{opacity:0;visibility:hidden}
.gate-in{max-width:420px}
.gate-in h2{font-family:'Playfair Display',serif;font-weight:400;font-style:italic;font-size:clamp(44px,12vw,84px);margin:8px 0 6px;color:#7d3d5c;letter-spacing:-.04em}
.gate-in p{color:var(--muted);margin:0 0 30px;font-size:15px;line-height:1.6}
.btn{font:600 13px 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;border:0;cursor:pointer;color:#fff;padding:16px 38px;border-radius:99px;background:linear-gradient(135deg,#d1688f,#a9466f);box-shadow:0 14px 34px #b5497c55;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 40px #b5497c77}
.link{display:block;margin:18px auto 0;background:none;border:0;font:500 12px 'DM Sans',sans-serif;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:4px}

/* player */
#player{position:fixed;z-index:20;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,140%);width:min(calc(100% - 28px),430px);display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:22px;background:#fffafac7;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #fff;box-shadow:0 18px 50px #9f5e8040;transition:transform .8s cubic-bezier(.22,.61,.36,1)}
#player.show{transform:translate(-50%,0)}
.cover{position:relative;width:52px;height:52px;flex:none;border-radius:50%;background:conic-gradient(#e9a1b8,#c76d91,#f7d3df,#e9a1b8);overflow:hidden;box-shadow:0 0 0 3px #fff,0 6px 14px #8d3f6640;animation:spin 7s linear infinite;animation-play-state:paused}
.playing .cover{animation-play-state:running}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px;border-radius:50%;background:#fff6f9;box-shadow:inset 0 0 0 1px #e3b5c6}
.meta{min-width:0;flex:1}
.meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta span{display:block;font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em}
.ptrack{height:3px;margin-top:8px;border-radius:9px;background:#efd3de;overflow:hidden}
.ptrack i{display:block;height:100%;width:0;background:var(--rose)}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px;width:18px;flex:none}
.eq i{flex:1;background:var(--rose);border-radius:2px;height:30%;animation:eq 1s ease-in-out infinite;animation-play-state:paused}
.playing .eq i{animation-play-state:running}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{50%{height:100%}}
.ctl{width:38px;height:38px;flex:none;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#d1688f,#a9466f);transition:transform .2s}
.ctl:hover{transform:scale(1.08)}
.ctl.ghost{background:#f8e3ea;color:var(--deep);width:32px;height:32px}
.ctl svg{width:15px;height:15px;fill:currentColor}

#listwrap{position:absolute;left:0;right:0;bottom:calc(100% + 10px);max-height:0;overflow:hidden;border-radius:20px;background:#fffafaee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 50px #9f5e8040;transition:max-height .5s cubic-bezier(.22,.61,.36,1)}
#listwrap.open{max-height:260px;overflow-y:auto}
#list{list-style:none;margin:0;padding:8px}
#list button{display:block;width:100%;text-align:left;border:0;background:none;font:500 13px 'DM Sans',sans-serif;color:var(--ink);padding:10px 12px;border-radius:12px;cursor:pointer}
#list button:hover{background:#f8e3ea}
#list button.on{background:#f3d3df;color:var(--deep);font-weight:700}
@media(max-width:520px){.card{border-radius:26px}.card::before{inset:10px;border-radius:18px}.corner{display:none}.unit{border-radius:14px;padding:20px 2px 14px}.label{letter-spacing:0}.pmeta{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.scene{display:none}.reveal{opacity:1;transform:none}}
</style>
</head>

<svg class="branch right" viewBox="0 0 360 360" aria-hidden="true"><path d="M-20 35Q120 60 255 270M90 68Q150 45 200 12M150 125Q228 112 285 55M188 174Q260 180 338 135" fill="none" stroke="#ab6c81" stroke-width="5" stroke-linecap="round"/><g fill="#e9a1b8"><circle cx="200" cy="12" r="14"/><circle cx="285" cy="55" r="17"/><circle cx="338" cy="135" r="13"/><circle cx="255" cy="270" r="19"/><circle cx="145" cy="47" r="13"/><circle cx="224" cy="113" r="11"/></g></svg>

<main class="card">
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
  <svg class="orn reveal" style="--i:0" viewBox="-30 -30 60 60" aria-hidden="true"><g fill="#eaa3b8" stroke="#c76d91" stroke-width=".6"><ellipse cy="-14" rx="8" ry="13"/><ellipse cy="-14" rx="8" ry="13" transform="rotate(72)"/><ellipse cy="-14" rx="8" ry="13" transform="rotate(144)"/><ellipse cy="-14" rx="8" ry="13" transform="rotate(216)"/><ellipse cy="-14" rx="8" ry="13" transform="rotate(288)"/></g><circle r="5" fill="#fff4f8" stroke="#c76d91" stroke-width=".6"/></svg>
  <p class="eyebrow reveal" style="--i:1">Cuenta regresiva</p>

  <div class="divider reveal" style="--i:3" aria-hidden="true"><i></i><b></b><i></i></div>

<script>
/* ===== Ajustes ===== */
const START = Date.parse('2026-11-17T00:00:00-05:00'); // inicio del conteo (para la barra de progreso)
const LOCAL_AUDIO = '';                                   // opcional: ruta a un mp3 propio, ej. 'musica.mp3'
const SEARCH = 'https://itunes.apple.com/search?term=olivia+rodrigo&media=music&entity=song&limit=40&country=US';

/* ===== Cuenta regresiva ===== */
const target = Date.parse(document.querySelector('time').dateTime);
const heading = document.getElementById('heading');
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const digits = ['days','hours','minutes','seconds'].map(id => document.getElementById(id));
const fill = document.getElementById('fill'), pctEl = document.getElementById('pct');
const done = document.createElement('em'); done.textContent = '¡Ya saliste de la poderosa UNEJAM!';

function update(animate = true){
  const total = Math.max(0, Math.ceil((target - Date.now()) / 1000));
  const parts = [Math.floor(total/86400), Math.floor(total%86400/3600), Math.floor(total%3600/60), total%60];
  digits.forEach((d,i) => {
    const v = String(parts[i]).padStart(2,'0');
    if (d.textContent === v) return;
    d.textContent = v;
    if (animate && !reduced.matches && d.animate)
      d.animate([{transform:'translateY(.22em)',opacity:.4},{transform:'translateY(0)',opacity:1}], {duration:300,easing:'cubic-bezier(.18,.67,.36,1)'});
  });
  const p = Math.min(1, Math.max(0, (Date.now() - START) / (target - START)));
  fill.style.width = (p*100).toFixed(1) + '%';
  pctEl.textContent = (p*100).toFixed(1) + '%';
  if (total === 0){ heading.replaceChildren('¡Por fin, Litsi! ', done); clearInterval(timer); }
}
const timer = setInterval(update, 250);
update(false);
requestAnimationFrame(() => setTimeout(() => update(false), 200));

/* ===== Pétalos ===== */
const scene = document.getElementById('petals');
for (let i = 0; i < 32; i++){
  const s = document.createElement('span'), dur = 11 + Math.random()*12;
  s.className = 'petal';
  s.style.setProperty('--left', Math.random()*100 + '%');
  s.style.setProperty('--width', 7 + Math.random()*10 + 'px');
  s.style.setProperty('--opacity', .36 + Math.random()*.46);
  s.style.setProperty('--drift', (Math.random()-.5)*210 + 'px');
  s.style.setProperty('--duration', dur + 's');
  s.style.setProperty('--delay', '-' + Math.random()*dur + 's');
  scene.appendChild(s);
}

/* ===== Luz que sigue al cursor ===== */
addEventListener('pointermove', e => {
  document.documentElement.style.setProperty('--mx', e.clientX + 'px');
  document.documentElement.style.setProperty('--my', e.clientY + 'px');
}, {passive:true});

/* ===== Música (previews de la API pública de iTunes) ===== */
const $ = id => document.getElementById(id);
const player = $('player'), audio = new Audio();
audio.volume = .55; audio.preload = 'auto';
let tracks = [], idx = 0, ready = false;
const PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

let jid = 0;
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = '__it' + Date.now() + '_' + (jid++), s = document.createElement('script');
    const clean = () => { delete window[cb]; s.remove(); clearTimeout(t); };
    const t = setTimeout(() => { clean(); reject(new Error('timeout')); }, 8000);
    window[cb] = d => { clean(); resolve(d); };
    s.onerror = () => { clean(); reject(new Error('jsonp')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function loadTracks(){
  if (LOCAL_AUDIO){ tracks = [{trackName:'Tu canción', artistName:'Olivia Rodrigo', previewUrl:LOCAL_AUDIO}]; return; }
  const terms = ['olivia rodrigo','olivia rodrigo good 4 u','olivia rodrigo vampire','olivia rodrigo drivers license','olivia rodrigo get him back','olivia rodrigo traitor','olivia rodrigo deja vu','olivia rodrigo brutal','olivia rodrigo obsessed','olivia rodrigo bad idea right','olivia rodrigo happier','olivia rodrigo love is embarrassing'];
  const base = 'https://itunes.apple.com/search?media=music&entity=song&limit=15&country=US&term=';
  const all = [];
  await Promise.all(terms.map(async q => {
    try{ const j = await jsonp(base + encodeURIComponent(q)); all.push(...(j.results || [])); }catch(e){}
  }));
  const seen = new Set();
  tracks = all.filter(t => t.previewUrl && /^olivia rodrigo$/i.test(t.artistName.trim()))
    .filter(t => { const k = t.trackName.replace(/\(.*?\)|\[.*?\]/g,'').replace(/ - .*/,'').trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; })
    .sort(() => Math.random() - .5).slice(0, 20);
  buildList();
}
function buildList(){
  const ul = $('list'); ul.innerHTML = '';
  tracks.forEach((t,i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.textContent = t.trackName; b.onclick = () => { setTrack(i); playNow(); };
    li.appendChild(b); ul.appendChild(li);
  });
}
function setTrack(i){
  idx = (i + tracks.length) % tracks.length;
  const t = tracks[idx];
  audio.src = t.previewUrl;
  $('title').textContent = t.trackName;
  $('artist').textContent = t.artistName;
  document.querySelectorAll('#list button').forEach((b,k) => b.classList.toggle('on', k === idx));
  const art = $('art');
  if (t.artworkUrl100){ art.src = t.artworkUrl100.replace('100x100','300x300'); art.hidden = false; } else art.hidden = true;
}
function syncUI(){
  const on = !audio.paused;
  player.classList.toggle('playing', on);
  $('ico').innerHTML = on ? PAUSE : PLAY;
}
async function playNow(){
  try{ await audio.play(); }
  catch(e){ if (e.name !== 'NotAllowedError' && e.name !== 'AbortError' && tracks.length > 1){ setTrack(idx + 1); return playNow(); } }
  syncUI();
}
$('listbtn').onclick = () => $('listwrap').classList.toggle('open');

audio.addEventListener('ended', () => { setTrack(idx + 1); playNow(); });
audio.addEventListener('error', () => { if (tracks.length > 1){ setTrack(idx + 1); playNow(); } });
audio.addEventListener('play', syncUI); audio.addEventListener('pause', syncUI);
audio.addEventListener('timeupdate', () => { if (audio.duration) $('ptime').style.width = audio.currentTime / audio.duration * 100 + '%'; });
$('toggle').onclick = () => audio.paused ? playNow() : audio.pause();
$('next').onclick = () => { setTrack(idx + 1); playNow(); };

async function enter(withMusic){
  $('gate').classList.add('out');
  document.body.classList.remove('locked');
  await loadTracks();
  if (!tracks.length){ return; }
  setTrack(0);
  player.classList.add('show');
  if (withMusic) playNow(); else syncUI();
}
$('enter').onclick = () => enter(true);
$('mute').onclick = () => enter(false);
</script>
</body>
</html>
